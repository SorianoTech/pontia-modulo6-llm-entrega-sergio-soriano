services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tenerife-db
    environment:
      POSTGRES_DB: tenerife_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenerife_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tenerife-web
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tenerife_app
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      AUTO_INGEST_ON_STARTUP: "true"
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-gemini-2.5-flash-lite}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-models/gemini-embedding-001}
    ports:
      - "8000:8000"
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .\data:/app/data:ro
      - .\logs:/app/logs

  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: tenerife-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - .\prometheus\prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      web:
        condition: service_started

  grafana:
    image: grafana/grafana:12.0.1
    container_name: tenerife-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - .\grafana\provisioning\datasources:/etc/grafana/provisioning/datasources:ro
      - .\grafana\provisioning\dashboards:/etc/grafana/provisioning/dashboards:ro
      - .\grafana\dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

  loki:
    image: grafana/loki:3.0.0
    container_name: tenerife-loki
    command:
      - -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - .\loki\config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.0.0
    container_name: tenerife-promtail
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - .\promtail\config.yml:/etc/promtail/config.yml:ro
      - .\logs:/var/log/tenerife:ro
    depends_on:
      loki:
        condition: service_started

volumes:
  postgres-data:
  grafana-data:
  loki-data:
