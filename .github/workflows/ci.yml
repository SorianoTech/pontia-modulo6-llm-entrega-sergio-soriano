name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Validate compose file
        run: docker compose config

      - name: Build Docker image
        run: docker build -t tenerife-rag-app:ci .

