server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: tenerife-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: tenerife-app
          service: web
          __path__: /var/log/tenerife/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            event: event
            level: level
            logger: logger
            path: path
      - labels:
          event:
          level:
          logger:
