[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenerife-rag-app"
version = "0.1.0"
description = "Aplicacion web conversacional sobre Tenerife con FastAPI, RAG y pgvector."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "jinja2>=3.1.0,<4.0.0",
  "langchain>=0.3.0,<0.4.0",
  "langchain-core>=0.3.0,<1.0.0",
  "langchain-google-genai>=2.1.0,<3.0.0",
  "langchain-text-splitters>=0.3.0,<1.0.0",
  "prometheus-client>=0.21.0,<1.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pgvector>=0.3.0,<1.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "pypdf>=5.0.0,<6.0.0",
  "python-multipart>=0.0.18,<1.0.0",
  "requests>=2.32.0,<3.0.0",
  "streamlit>=1.46.0,<2.0.0",
  "structlog>=24.4.0,<26.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "sphinx>=8.0.0,<9.0.0",
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.8.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebook", "logs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
