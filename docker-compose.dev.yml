services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tenerife-db-dev
    environment:
      POSTGRES_DB: tenerife_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenerife_app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-dev-data:

